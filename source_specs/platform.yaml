openapi: 3.0.0
info:
  version: '2026-04-01'
  title: Glean Platform API
  x-source-commit-sha: d21cc175fcadae0744cb414a1774f5dc4d54afce
servers:
  - url: https://{domain}-be.glean.com/api
    variables:
      domain:
        default: domain
        description: Backend subdomain for the API (e.g. mycompany or be4f5226 for new customers)
security:
  - ApiToken: []
paths:
  /agents/search:
    post:
      tags:
        - Agents
      summary: Search agents
      description: |
        Search agents available to the authenticated user by agent name.
      operationId: platform-agents-search
      x-visibility: Public
      x-glean-sdk:
        group: agents
        method: search
      x-codegen-request-body-name: payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentsSearchRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agents/{agent_id}:
    get:
      tags:
        - Agents
      summary: Get agent
      description: |
        Retrieve details for an agent available to the authenticated user.
      operationId: platform-agents-get
      x-visibility: Public
      x-glean-sdk:
        group: agents
        method: get
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent to retrieve.
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agents/{agent_id}/schemas:
    get:
      tags:
        - Agents
      summary: Get agent schemas
      description: |
        Retrieve an agent's input and output JSON schemas.
      operationId: platform-agents-get-schemas
      x-visibility: Public
      x-glean-sdk:
        group: agents
        method: getSchemas
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent whose schemas should be retrieved.
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: include_tools
          description: Whether to include tool metadata in the response.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSchemasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agents/{agent_id}/runs:
    post:
      tags:
        - Agents
      summary: Create agent run
      description: |
        Execute an agent run. Set `stream` to true to receive server-sent events; otherwise the response contains the final agent messages.
      operationId: platform-agents-create-run
      x-visibility: Public
      x-glean-sdk:
        group: agents
        method: createRun
      x-codegen-request-body-name: payload
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent to run.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunCreateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunWaitResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events emitted by the running agent. Successful runs emit `message` events. A terminal failure after the stream has started emits exactly one `run.failed` event whose `data` is an `AgentRunFailedEventData` payload, then closes.
                example: |
                  id: 1
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":"Hello","type":"text"}]}]}

                  id: 2
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":", I can help with HR policy questions.","type":"text"}]}]}

                  id: 3
                  event: run.failed
                  data: {"error":{"type":"https://developers.glean.com/errors/spend-limit-exceeded","title":"Spend Limit Exceeded","status":403,"detail":"You've reached the monthly limit set by your admin.","code":"spend_limit_exceeded","request_id":"req_123","documentation_url":"https://developers.glean.com/errors/spend-limit-exceeded"}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: Returned when the agent has tools the caller must authorize before the run can start. `authentication_suggestions` names each such tool; POST its `server_id` to the Client API's `/tool-servers/{serverId}/auth` with `returnUrl` in the request body to obtain an `authorizationUrl` to redirect the end user to, then retry the run once OAuth completes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedAgentToolsProblem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chat:
    post:
      tags:
        - Chat
      summary: Create a chat response
      description: |
        Run an assistant turn. Set `stream` to true to receive server-sent events; otherwise the response is a typed JSON response object.
      operationId: platform-chat-create
      x-visibility: Public
      x-glean-sdk:
        group: chat
        method: create
      x-glean-experimental:
        id: e65a0a77-97a2-4c91-be60-eae7f6238015
        introduced: '2026-07-14'
      x-codegen-request-body-name: payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletedResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events for a streaming chat run. Event payloads are documented under ChatStream* schemas.
                example: |
                  id: 1
                  event: response.created
                  data: {"type":"response.created","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015"}

                  id: 2
                  event: response.progress
                  data: {"type":"response.progress","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","text":"**Searching:** foo"}

                  id: 3
                  event: response.output_text.delta
                  data: {"type":"response.output_text.delta","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","delta":"Hello"}

                  id: 4
                  event: response.output_text.done
                  data: {"type":"response.output_text.done","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","text":"Hello"}

                  id: 5
                  event: response.completed
                  data: {"type":"response.completed","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","response":{"id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","object":"response","status":"completed","output":[{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Hello"}]}],"store":true,"request_id":"req_123","created_at":"2026-07-14T20:00:00Z"}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills:
    post:
      tags:
        - Skills
      summary: Create skill
      description: |
        Create a skill from an uploaded SKILL.md, .zip, or .skill bundle. If the authenticated user already has a skill with the same name, the existing skill is superseded with a new version.
      operationId: platform-skills-create
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: create
      x-glean-experimental:
        id: 3cd55572-0d5c-4898-9ecf-1b86c520d1c7
        introduced: '2026-06-24'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
        x-codegen-request-body-name: request
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Skills
      summary: List skills
      description: |
        List skills available to the authenticated user.
      operationId: platform-skills-list
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: list
      x-glean-experimental:
        id: 3eb65937-03a3-472b-9a00-be713f302b5f
        introduced: '2026-06-23'
      parameters:
        - in: query
          name: page_size
          description: Maximum number of skills to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          description: Opaque pagination cursor from a previous response.
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/validation:
    post:
      tags:
        - Skills
      summary: Validate skill bundle
      description: |
        Validate a skill bundle without persisting it. Accepts a SKILL.md, .zip, or .skill upload and returns parsed metadata plus the normalized file layout.
      operationId: platform-skills-validate
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: validate
      x-glean-experimental:
        id: 0b086fa6-30f8-4279-8d11-10ab0059c14a
        introduced: '2026-06-24'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SkillValidationRequest'
        x-codegen-request-body-name: request
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/import:
    post:
      tags:
        - Skills
      summary: Import skills from GitHub
      description: |
        Import one or more skills selected from a GitHub source preview. Each source URL is fetched and persisted as an independent skill with source provenance. This operation does not create a durable source resource. The import is atomic: if any source cannot be fetched, validated, or persisted, no skills are created.
      operationId: platform-skills-import
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: import
      x-glean-experimental:
        id: 9162d790-e101-437d-a9a0-25e4687d150b
        introduced: '2026-07-28'
      x-codegen-request-body-name: request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillImportRequest'
      responses:
        '200':
          description: Skills imported successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/sources/preview:
    post:
      tags:
        - Skills
      summary: Preview a GitHub skill source
      description: |
        Inspect a GitHub URL without persisting a source or any discovered skills. Set stream to true to receive repository scan progress as server-sent events; otherwise the response contains the completed preview.
      operationId: platform-skills-preview-source
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: previewSource
      x-glean-experimental:
        id: 1629009b-244a-400a-bf55-c441dfbc586c
        introduced: '2026-07-23'
      x-codegen-request-body-name: request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillSourcePreviewRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSourcePreviewResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent scan, progress, skill, and result events. A failed stream
                  emits `data: {"type":"error","code":"service_unavailable","message":"GitHub is temporarily unavailable."}`
                  followed by `data: [DONE]` instead of a result event.
                example: |
                  data: {"type":"scan","total":1,"skill_paths":["https://github.com/acme/skills/tree/main/skills/example"]}

                  data: {"type":"progress","completed":1,"total":1,"current_skill":"skills/example/SKILL.md"}

                  data: {"type":"skill","skill":{"display_name":"Example","description":"Example skill","source_url":"https://github.com/acme/skills/tree/main/skills/example","commit_sha":"abc123","main_content":"---\nname: Example\n---","files":[],"file_tree":["SKILL.md"]}}

                  data: {"type":"result","response":{"skills":[{"display_name":"Example","description":"Example skill","source_url":"https://github.com/acme/skills/tree/main/skills/example","commit_sha":"abc123","main_content":"---\nname: Example\n---","files":[],"file_tree":["SKILL.md"]}],"failures":[],"request_id":"req-123"}}

                  data: [DONE]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/{skill_id}:
    patch:
      tags:
        - Skills
      summary: Update skill
      description: |
        Update mutable metadata for a skill. V1 supports enabling or disabling a skill without changing its content.
      operationId: platform-skills-update
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: update
      x-glean-experimental:
        id: 262e1f6b-6c2d-4d6d-943b-fc251d2fb38b
        introduced: '2026-07-20'
      parameters:
        - name: skill_id
          in: path
          required: true
          description: Glean skill ID.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdateRequest'
        x-codegen-request-body-name: request
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Skills
      summary: Delete skill
      description: |
        Delete a skill the authenticated caller is allowed to manage. This operation permanently removes all versions of the skill.
      operationId: platform-skills-delete
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: delete
      x-glean-experimental:
        id: c4351fd0-4d28-4ad4-ab93-587ca4778173
        introduced: '2026-07-31'
      parameters:
        - name: skill_id
          in: path
          required: true
          description: Glean skill ID.
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: Skill deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Skills
      summary: Retrieve skill
      description: |
        Retrieve metadata for a skill available to the authenticated user.
      operationId: platform-skills-get
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: retrieve
      x-glean-experimental:
        id: 8f8d1c92-a484-4769-9903-200613dc8a72
        introduced: '2026-06-23'
      parameters:
        - name: skill_id
          in: path
          required: true
          description: Glean skill ID.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/{skill_id}/content:
    get:
      tags:
        - Skills
      summary: Download skill content
      description: |
        Download the latest installable bundle for a skill available to the authenticated user.
      operationId: platform-skills-get-content
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: retrieveContent
      x-glean-experimental:
        id: fd6908d8-f230-4cd5-bf45-f71e69266b1d
        introduced: '2026-06-24'
      parameters:
        - name: skill_id
          in: path
          required: true
          description: Glean skill ID.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response.
          headers:
            Content-Disposition:
              description: Attachment filename for the skill bundle.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /skills/{skill_id}/sync:
    post:
      tags:
        - Skills
      summary: Sync a GitHub-imported skill
      description: |
        Refresh one GitHub-imported skill from its stored source URL. If the skill content has changed, this operation creates a new skill version. If the skill is no longer present upstream, the stored skill is left unchanged and must be deleted explicitly.
      operationId: platform-skills-sync
      x-visibility: Public
      x-glean-sdk:
        group: skills
        method: sync
      x-glean-experimental:
