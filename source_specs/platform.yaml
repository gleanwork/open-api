  /search/filters:
    get:
      tags:
        - Search
      summary: List search filters
      description: |
        List datasources and common built-in filter fields visible to the authenticated user. This is a best-effort catalog, not an exhaustive list of every filter search accepts.
        Without `query`, returns field metadata only and does not run a search. With a nonblank `query`, provide exactly one `datasources` value to request suggested filter values for that query; no documents are returned and this endpoint does not include warning objects. See `FilterFieldInfo.values` for limitations on suggested values. Rate-limited requests return HTTP 429 with `Retry-After`; temporary backend unavailability returns HTTP 503.
      operationId: platform-search-filters
      x-visibility: Public
      x-glean-sdk:
        group: search
        method: listFilters
      x-glean-experimental:
        id: 0b585621-13fb-4544-bf20-5e1c99452735
        introduced: '2026-05-12'
      parameters:
        - in: query
          name: datasources
          description: |
            Restrict metadata to one or more datasource identifiers as returned by this endpoint (for example, `jira`). With a nonblank `query`, exactly one datasource is required. Unknown or inaccessible identifiers return `invalid_datasource`.
          required: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        - in: query
          name: query
          description: |
            Optional search query that requests suggested filter values for the selected datasource. Must be nonblank when present. Triggers a search for facet values only; does not return documents.
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: |
                Present as `no-store` for query-backed discovery responses. Catalog-only responses omit this endpoint-specific override.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFiltersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    ApiToken:
      type: http
      scheme: bearer
      description: |
        Glean API token. Obtain via Admin Console -> Platform -> API Tokens, or via OAuth 2.0 client credentials flow.
  schemas:
    AgentsSearchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Case-insensitive substring to match against agent names. If omitted or empty, no name filter is applied.
          example: HR Policy Agent
    AgentCapabilities:
      type: object
      additionalProperties: true
      properties:
        ap.io.messages:
          type: boolean
          description: Whether the agent supports messages as input.
        ap.io.streaming:
          type: boolean
          description: Whether the agent supports streaming output.
    Agent:
      type: object
      required:
        - agent_id
        - name
        - capabilities
      properties:
        agent_id:
          type: string
          description: ID of the agent.
          example: mho4lwzylcozgoc2
        name:
          type: string
          description: Name of the agent.
          example: HR Policy Agent
        description:
          type: string
          description: Description of the agent.
        metadata:
          type: object
          description: Agent metadata.
          additionalProperties: true
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
    AgentsSearchResponse:
      type: object
      required:
        - agents
        - request_id
      properties:
        agents:
          type: array
          description: Agents matching the search request.
          items:
            $ref: '#/components/schemas/Agent'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    ProblemDetailCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - invalid_request
        - missing_required_field
        - invalid_parameter
        - invalid_cursor
        - expired_cursor
        - invalid_filter
        - invalid_datasource
        - authentication_required
        - token_expired
        - insufficient_permissions
        - spend_limit_exceeded
        - resource_not_found
        - method_not_allowed
        - request_timeout
        - request_too_large
        - token_limit_exceeded
        - conflict
        - gone
        - unprocessable_query
        - tools_unauthorized
        - rate_limit_exceeded
        - internal_error
        - service_unavailable
      x-glean-problem-detail-codes:
        invalid_request:
          status: 400
          title: Invalid Request
        missing_required_field:
          status: 400
          title: Missing Required Field
        invalid_parameter:
          status: 400
          title: Invalid Parameter
        invalid_cursor:
          status: 400
          title: Invalid Pagination Cursor
        expired_cursor:
          status: 400
          title: Expired Pagination Cursor
        invalid_filter:
          status: 400
          title: Invalid Filter
        invalid_datasource:
          status: 400
          title: Invalid Datasource
        authentication_required:
          status: 401
          title: Authentication Required
        token_expired:
          status: 401
          title: Token Expired
        insufficient_permissions:
          status: 403
          title: Insufficient Permissions
        spend_limit_exceeded:
          status: 403
          title: Spend Limit Exceeded
        resource_not_found:
          status: 404
          title: Resource Not Found
        method_not_allowed:
          status: 405
          title: Method Not Allowed
        request_timeout:
          status: 408
          title: Request Timeout
        request_too_large:
          status: 413
          title: Request Too Large
        token_limit_exceeded:
          status: 413
          title: Token Limit Exceeded
        conflict:
          status: 409
          title: Conflict
        gone:
          status: 410
          title: Gone
        unprocessable_query:
          status: 422
          title: Unprocessable Query
        tools_unauthorized:
          status: 422
          title: Tools Unauthorized
        rate_limit_exceeded:
          status: 429
          title: Rate Limit Exceeded
        internal_error:
          status: 500
          title: Internal Error
        service_unavailable:
          status: 503
          title: Service Unavailable
      example: invalid_cursor
    ProblemDetailError:
      type: object
      required:
        - pointer
        - detail
      description: Field-level validation problem for a single offending field.
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer to the offending field.
          example: /messages/0/role
        detail:
          type: string
          description: Human-readable explanation for this field.
          example: 'Must be one of: USER, GLEAN_AI.'
        code:
          $ref: '#/components/schemas/ProblemDetailCode'
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
      description: |
        Error response following RFC 9457, extended with `code` and `documentation_url` for machine-readable classification and self-service remediation.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type.
          example: https://developers.glean.com/errors/invalid-cursor
        title:
          type: string
          description: Short, human-readable summary of the error.
          example: Invalid Pagination Cursor
        status:
          type: integer
          description: HTTP status code mirrored from the response.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: |
            The provided cursor has expired. Start a new search to get a fresh cursor.
        code:
          $ref: '#/components/schemas/ProblemDetailCode'
        documentation_url:
          type: string
          format: uri
          description: Direct URL to documentation for this error code.
          example: https://developers.glean.com/errors/invalid-cursor
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
          example: req_7f8a9b0c1d2e
        errors:
          type: array
          description: Field-level validation problems, one entry per offending field.
          items:
            $ref: '#/components/schemas/ProblemDetailError'
    AgentGetResponse:
      type: object
      required:
        - agent
        - request_id
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    ActionSummary:
      type: object
      required:
        - tool_id
        - display_name
      properties:
        tool_id:
          type: string
          description: Unique identifier of the action.
        display_name:
          type: string
          description: Display name of the action.
        type:
          type: string
          description: Tool type.
        auth_type:
          type: string
          description: Authentication type required by the action.
        write_action_type:
          type: string
          description: Write-action execution type.
        is_setup_finished:
          type: boolean
          description: Whether this action has been fully configured.
        data_source:
          type: string
          description: Kind of knowledge the action accesses or modifies.
    AgentSchemasResponse:
      type: object
      required:
        - agent_id
        - input_schema
        - output_schema
        - request_id
      properties:
        agent_id:
          type: string
          description: ID of the agent.
        name:
          type: string
          description: Name of the agent.
        input_schema:
          type: object
          description: Agent input schema in JSON Schema format.
          additionalProperties: true
        output_schema:
          type: object
          description: Agent output schema in JSON Schema format.
          additionalProperties: true
        tools:
          type: array
          description: Tools that the agent can invoke, when requested.
          items:
            $ref: '#/components/schemas/ActionSummary'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    MessageRole:
      type: string
      description: Role of the message author.
      example: USER
      enum:
        - USER
        - GLEAN_AI
    ContentType:
      type: string
      enum:
        - text
    MessageTextBlock:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
          description: Text content.
        type:
          $ref: '#/components/schemas/ContentType'
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: array
          minItems: 1
          description: Content blocks in the message.
          items:
            $ref: '#/components/schemas/MessageTextBlock'
    AgentRunCreateRequest:
      type: object
      additionalProperties: false
      description: |
        Request to run an agent. A request MUST supply either `messages` (a non-empty conversation) or `input` (for input-form triggered agents).
      properties:
        input:
          type: object
          description: Input fields for an input-form triggered agent.
          additionalProperties: true
        messages:
          type: array
          minItems: 1
          description: |
            Messages to pass to the agent. When provided, the array MUST contain at least one message and each message MUST specify a valid `role` and non-empty `content`.
          items:
            $ref: '#/components/schemas/Message'
        metadata:
          type: object
          description: Metadata to pass to the agent.
          additionalProperties: true
        stream:
          type: boolean
          description: Whether to stream the run response as server-sent events.
          default: false
    AgentRunCreate:
      type: object
      required:
        - agent_id
      properties:
        agent_id:
          type: string
          description: ID of the agent being run.
        input:
          type: object
          description: Input fields for an input-form triggered agent.
          additionalProperties: true
        messages:
          type: array
          description: Messages passed to the agent.
          items:
            $ref: '#/components/schemas/Message'
        metadata:
          type: object
          description: Metadata passed to the agent.
          additionalProperties: true
    AgentExecutionStatus:
      type: string
      description: Status of the agent run.
      enum:
        - error
        - success
    AgentRun:
      allOf:
        - $ref: '#/components/schemas/AgentRunCreate'
        - type: object
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/AgentExecutionStatus'
    AgentRunWaitResponse:
      type: object
      required:
        - request_id
      properties:
        run:
          $ref: '#/components/schemas/AgentRun'
        messages:
          type: array
          description: Messages returned by the completed run.
          items:
            $ref: '#/components/schemas/Message'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    AuthenticationSuggestion:
      type: object
      description: One tool the caller must authorize before the agent can run.
      required:
        - server_id
      properties:
        tool_name:
          type: string
          description: Human-readable tool name.
        server_id:
          type: string
          description: Identifier to POST to `/tool-servers/{serverId}/auth` (Client API) with `returnUrl` in the request body to obtain an `authorizationUrl` to redirect the end user to.
    UnauthorizedAgentToolsProblem:
      description: Problem detail extended with `authentication_suggestions` naming each tool the caller must authorize.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required:
            - authentication_suggestions
          properties:
            authentication_suggestions:
              type: array
              description: One entry per tool the caller must authorize.
              items:
                $ref: '#/components/schemas/AuthenticationSuggestion'
    ChatInputMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
    ChatCreateRequest:
      type: object
      additionalProperties: false
      required:
        - input
      properties:
        input:
          description: |
            Either a plain string (single user turn) or a chronological array of `user`/`assistant` messages. The final array message must be `user`.
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChatInputMessage'
        stream:
          type: boolean
          description: |
            When true, respond with `text/event-stream`. When false or omitted, respond with `application/json`.
          default: false
        store:
          type: boolean
          description: |
            When true (default), persist the interaction and return a `conversation_id`. When false, run ephemerally with no persistence.
          default: true
        conversation_id:
          type: string
          minLength: 1
          description: |
            Continue an existing stored conversation. Incompatible with message-array `input` and with `store: false`.
    ChatStreamResponseId:
      type: string
      minLength: 1
      pattern: ^resp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: |
        Platform-owned, non-persisted response envelope identifier in `resp_<uuid>` form. The same identifier is used for every event in one streamed response.
    ChatDocumentSource:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - document
        document_id:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        title:
          type: string
        datasource:
          type: string
      anyOf:
        - required:
            - document_id
        - required:
            - url
    ChatPersonSource:
      type: object
      additionalProperties: false
      required:
        - type
        - person_id
      properties:
        type:
          type: string
          enum:
            - person
        person_id:
          type: string
          minLength: 1
        name:
          type: string
        url:
          type: string
    ChatFileSource:
      type: object
      additionalProperties: false
      required:
        - type
