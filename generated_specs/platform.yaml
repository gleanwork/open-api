          $ref: "#/components/responses/PlatformTooManyRequests"
        "500":
          $ref: "#/components/responses/PlatformInternalServerError"
        "503":
          $ref: "#/components/responses/PlatformServiceUnavailable"
      x-speakeasy-group: triggers
      x-speakeasy-name-override: listPresets
  /api/trigger-presets/{preset_id}:
    get:
      tags:
        - Triggers
      summary: Get trigger preset
      description: |
        Retrieve a single trigger preset by id.
      operationId: platform-trigger-presets-get
      x-visibility: Public
      x-glean-experimental:
        id: 5277167d-909b-4eee-95d1-8958b07016bb
        introduced: "2026-07-22"
      parameters:
        - in: path
          name: preset_id
          description: ID of the preset to retrieve.
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTriggerPresetGetResponse"
        "400":
          $ref: "#/components/responses/PlatformBadRequest"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/PlatformNotFound"
        "408":
          $ref: "#/components/responses/PlatformRequestTimeout"
        "429":
          $ref: "#/components/responses/PlatformTooManyRequests"
        "500":
          $ref: "#/components/responses/PlatformInternalServerError"
        "503":
          $ref: "#/components/responses/PlatformServiceUnavailable"
      x-speakeasy-group: triggers
      x-speakeasy-name-override: getPreset
  /api/trigger-presets/{preset_id}/input-values:
    get:
      tags:
        - Triggers
      summary: Search trigger preset input values
      description: |
        Return up to 300 selectable values for a single picklist input on a preset. Results are intended for typeahead selection and are not cursor-paginated. When `is_truncated` is true, refine `query` to narrow the result set.
      operationId: platform-trigger-presets-input-values-list
      x-visibility: Public
      x-glean-experimental:
        id: 24c5675d-a57a-48cb-9d71-3dece296f28c
        introduced: "2026-08-06"
      parameters:
        - in: path
          name: preset_id
          description: ID of the preset the input belongs to.
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: field
          description: Field identifier of the input whose values to list.
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: query
          description: |
            Prefix filter over the input's option values, for typeahead. Matching is on the option value, not its display name.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTriggerPresetInputValueListResponse"
        "400":
          $ref: "#/components/responses/PlatformBadRequest"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/PlatformNotFound"
        "408":
          $ref: "#/components/responses/PlatformRequestTimeout"
        "429":
          $ref: "#/components/responses/PlatformTooManyRequests"
        "500":
          $ref: "#/components/responses/PlatformInternalServerError"
        "503":
          $ref: "#/components/responses/PlatformServiceUnavailable"
      x-speakeasy-group: triggers
      x-speakeasy-name-override: listPresetInputValues
  /api/trigger-presets/{preset_id}/events/search:
    post:
      tags:
        - Triggers
      summary: Search events for a trigger preset
      description: |
        Search recent content events an unsaved trigger built from this preset would match, to preview it before creating the trigger. Read-only — no trigger is created and no webhook delivery is made. Covers the last seven days.
      operationId: platform-trigger-presets-events-search
      x-visibility: Public
      x-glean-experimental:
        id: a48efd80-78d6-46de-9f23-5b8c63ecd157
        introduced: "2026-08-12"
      parameters:
        - in: path
          name: preset_id
          description: ID of the preset to preview.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformTriggerPresetEventSearchRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTriggerEventSearchResponse"
        "400":
          $ref: "#/components/responses/PlatformBadRequest"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/PlatformNotFound"
        "408":
          $ref: "#/components/responses/PlatformRequestTimeout"
        "413":
          $ref: "#/components/responses/PlatformRequestTooLarge"
        "429":
          $ref: "#/components/responses/PlatformTooManyRequests"
        "500":
          $ref: "#/components/responses/PlatformInternalServerError"
        "503":
          $ref: "#/components/responses/PlatformServiceUnavailable"
      x-speakeasy-group: triggers
      x-speakeasy-name-override: searchPresetEvents
components:
  securitySchemes:
    APIToken:
      type: http
      scheme: bearer
      description: |
        Glean API token. Obtain via Admin Console -> Platform -> API Tokens, or via OAuth 2.0 client credentials flow.
  schemas:
    PlatformWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      description: Non-blocking warning attached to a successful Platform response.
      properties:
        code:
          type: string
          minLength: 1
          description: |
            Open snake_case warning code. Clients must tolerate unknown values; the set of codes is not a closed enum.
          example: results_incomplete
        message:
          type: string
          minLength: 1
          description: Human-readable warning message.
    PlatformAgentsSearchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Case-insensitive substring to match against agent names. If omitted or empty, no name filter is applied.
          example: HR Policy Agent
    PlatformAgentCapabilities:
      type: object
      additionalProperties: true
      properties:
        ap.io.messages:
          type: boolean
          description: Whether the agent supports messages as input.
        ap.io.streaming:
          type: boolean
          description: Whether the agent supports streaming output.
    PlatformAgent:
      type: object
      required:
        - agent_id
        - name
        - capabilities
      properties:
        agent_id:
          type: string
          description: ID of the agent.
          example: mho4lwzylcozgoc2
        name:
          type: string
          description: Name of the agent.
          example: HR Policy Agent
        description:
          type: string
          description: Description of the agent.
        metadata:
          type: object
          description: Agent metadata.
          additionalProperties: true
        capabilities:
          $ref: "#/components/schemas/PlatformAgentCapabilities"
    PlatformAgentsSearchResponse:
      type: object
      required:
        - agents
        - request_id
      properties:
        agents:
          type: array
          description: Agents matching the search request.
          items:
            $ref: "#/components/schemas/PlatformAgent"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformProblemDetailCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - invalid_request
        - missing_required_field
        - invalid_parameter
        - invalid_cursor
        - expired_cursor
        - invalid_filter
        - invalid_datasource
        - authentication_required
        - token_expired
        - insufficient_permissions
        - spend_limit_exceeded
        - resource_not_found
        - method_not_allowed
        - request_timeout
        - request_too_large
        - token_limit_exceeded
        - conflict
        - gone
        - unprocessable_query
        - tools_unauthorized
        - rate_limit_exceeded
        - internal_error
        - service_unavailable
      x-glean-problem-detail-codes:
        invalid_request:
          status: 400
          title: Invalid Request
        missing_required_field:
          status: 400
          title: Missing Required Field
        invalid_parameter:
          status: 400
          title: Invalid Parameter
        invalid_cursor:
          status: 400
          title: Invalid Pagination Cursor
        expired_cursor:
          status: 400
          title: Expired Pagination Cursor
        invalid_filter:
          status: 400
          title: Invalid Filter
        invalid_datasource:
          status: 400
          title: Invalid Datasource
        authentication_required:
          status: 401
          title: Authentication Required
        token_expired:
          status: 401
          title: Token Expired
        insufficient_permissions:
          status: 403
          title: Insufficient Permissions
        spend_limit_exceeded:
          status: 403
          title: Spend Limit Exceeded
        resource_not_found:
          status: 404
          title: Resource Not Found
        method_not_allowed:
          status: 405
          title: Method Not Allowed
        request_timeout:
          status: 408
          title: Request Timeout
        request_too_large:
          status: 413
          title: Request Too Large
        token_limit_exceeded:
          status: 413
          title: Token Limit Exceeded
        conflict:
          status: 409
          title: Conflict
        gone:
          status: 410
          title: Gone
        unprocessable_query:
          status: 422
          title: Unprocessable Query
        tools_unauthorized:
          status: 422
          title: Tools Unauthorized
        rate_limit_exceeded:
          status: 429
          title: Rate Limit Exceeded
        internal_error:
          status: 500
          title: Internal Error
        service_unavailable:
          status: 503
          title: Service Unavailable
      example: invalid_cursor
    PlatformProblemDetailError:
      type: object
      required:
        - pointer
        - detail
      description: Field-level validation problem for a single offending field.
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer to the offending field.
          example: /messages/0/role
        detail:
          type: string
          description: Human-readable explanation for this field.
          example: "Must be one of: USER, GLEAN_AI."
        code:
          $ref: "#/components/schemas/PlatformProblemDetailCode"
    PlatformProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
      description: |
        Error response following RFC 9457, extended with `code` and `documentation_url` for machine-readable classification and self-service remediation.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type.
          example: https://developers.glean.com/errors/invalid-cursor
        title:
          type: string
          description: Short, human-readable summary of the error.
          example: Invalid Pagination Cursor
        status:
          type: integer
          description: HTTP status code mirrored from the response.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: |
            The provided cursor has expired. Start a new search to get a fresh cursor.
        code:
          $ref: "#/components/schemas/PlatformProblemDetailCode"
        documentation_url:
          type: string
          format: uri
          description: Direct URL to documentation for this error code.
          example: https://developers.glean.com/errors/invalid-cursor
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
          example: req_7f8a9b0c1d2e
        errors:
          type: array
          description: Field-level validation problems, one entry per offending field.
          items:
            $ref: "#/components/schemas/PlatformProblemDetailError"
    PlatformAgentGetResponse:
      type: object
      required:
        - agent
        - request_id
      properties:
        agent:
          $ref: "#/components/schemas/PlatformAgent"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformActionSummary:
      type: object
      required:
        - tool_id
        - display_name
      properties:
        tool_id:
          type: string
          description: Unique identifier of the action.
        display_name:
          type: string
          description: Display name of the action.
        type:
          type: string
          description: Tool type.
        auth_type:
          type: string
          description: Authentication type required by the action.
        write_action_type:
          type: string
          description: Write-action execution type.
        is_setup_finished:
          type: boolean
          description: Whether this action has been fully configured.
        data_source:
          type: string
          description: Kind of knowledge the action accesses or modifies.
    PlatformAgentSchemasResponse:
      type: object
      required:
        - agent_id
        - input_schema
        - output_schema
        - request_id
      properties:
        agent_id:
          type: string
          description: ID of the agent.
        name:
          type: string
          description: Name of the agent.
        input_schema:
          type: object
          description: Agent input schema in JSON Schema format.
          additionalProperties: true
        output_schema:
          type: object
          description: Agent output schema in JSON Schema format.
          additionalProperties: true
        tools:
          type: array
          description: Tools that the agent can invoke, when requested.
          items:
            $ref: "#/components/schemas/PlatformActionSummary"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformMessageRole:
      type: string
      description: Role of the message author.
      example: USER
      enum:
        - USER
        - GLEAN_AI
    PlatformContentType:
      type: string
      enum:
        - text
    PlatformMessageTextBlock:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
          description: Text content.
        type:
          $ref: "#/components/schemas/PlatformContentType"
    PlatformMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          $ref: "#/components/schemas/PlatformMessageRole"
        content:
          type: array
          minItems: 1
          description: Content blocks in the message.
          items:
            $ref: "#/components/schemas/PlatformMessageTextBlock"
    PlatformAgentRunCreateRequest:
      type: object
      additionalProperties: false
      description: |
        Request to run an agent. A request MUST supply either `messages` (a non-empty conversation) or `input` (for input-form triggered agents).
      properties:
        input:
          type: object
          description: Input fields for an input-form triggered agent.
          additionalProperties: true
        messages:
          type: array
          minItems: 1
          description: |
            Messages to pass to the agent. When provided, the array MUST contain at least one message and each message MUST specify a valid `role` and non-empty `content`.
          items:
            $ref: "#/components/schemas/PlatformMessage"
        metadata:
          type: object
          description: Metadata to pass to the agent.
          additionalProperties: true
        stream:
          type: boolean
          description: Whether to stream the run response as server-sent events.
          default: false
    PlatformAgentRunCreate:
      type: object
      required:
        - agent_id
      properties:
        agent_id:
          type: string
          description: ID of the agent being run.
        input:
          type: object
          description: Input fields for an input-form triggered agent.
          additionalProperties: true
        messages:
          type: array
          description: Messages passed to the agent.
          items:
            $ref: "#/components/schemas/PlatformMessage"
        metadata:
          type: object
          description: Metadata passed to the agent.
          additionalProperties: true
    PlatformAgentExecutionStatus:
      type: string
      description: Status of the agent run.
      enum:
        - error
        - success
    PlatformAgentRun:
      allOf:
        - $ref: "#/components/schemas/PlatformAgentRunCreate"
        - type: object
          required:
            - status
          properties:
            status:
              $ref: "#/components/schemas/PlatformAgentExecutionStatus"
    PlatformAgentRunWaitResponse:
      type: object
      required:
        - request_id
      properties:
        run:
          $ref: "#/components/schemas/PlatformAgentRun"
        messages:
          type: array
          description: Messages returned by the completed run.
          items:
            $ref: "#/components/schemas/PlatformMessage"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformAuthenticationSuggestion:
      type: object
      description: One tool the caller must authorize before the agent can run.
      required:
        - server_id
      properties:
        tool_name:
          type: string
          description: Human-readable tool name.
        server_id:
          type: string
          description: Identifier to POST to `/tool-servers/{serverId}/auth` (Client API) with `returnUrl` in the request body to obtain an `authorizationUrl` to redirect the end user to.
    PlatformUnauthorizedAgentToolsProblem:
      description: Problem detail extended with `authentication_suggestions` naming each tool the caller must authorize.
      allOf:
        - $ref: "#/components/schemas/PlatformProblemDetail"
        - type: object
          required:
            - authentication_suggestions
          properties:
            authentication_suggestions:
              type: array
              description: One entry per tool the caller must authorize.
              items:
                $ref: "#/components/schemas/PlatformAuthenticationSuggestion"
    PlatformChatInputMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        content:
          type: string
          minLength: 1
    PlatformChatCreateRequest:
      type: object
      additionalProperties: false
      required:
        - input
      properties:
        input:
          description: |
            Either a plain string (single user turn) or a chronological array of `USER`/`ASSISTANT` messages. The final array message must be `USER`.
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/PlatformChatInputMessage"
        stream:
          type: boolean
          description: |
            When true, respond with `text/event-stream`. When false or omitted, respond with `application/json`.
          default: false
        store:
          type: boolean
          description: |
            When true (default), persist the interaction and return a `conversation_id`. When false, run ephemerally with no persistence.
          default: true
        conversation_id:
          type: string
          minLength: 1
          description: |
            Continue an existing stored conversation. Incompatible with message-array `input` and with `store: false`.
    PlatformChatStreamResponseId:
      type: string
      minLength: 1
      pattern: ^resp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: |
        Platform-owned, non-persisted response envelope identifier in `resp_<uuid>` form. The same identifier is used for every event in one streamed response.
    PlatformChatDocumentSource:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - DOCUMENT
        document_id:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        title:
          type: string
        datasource:
          type: string
      anyOf:
        - required:
            - document_id
        - required:
            - url
    PlatformChatPersonSource:
      type: object
      additionalProperties: false
      required:
        - type
        - person_id
      properties:
        type:
          type: string
          enum:
            - PERSON
        person_id:
          type: string
          minLength: 1
        name:
          type: string
        url:
          type: string
    PlatformChatFileSource:
      type: object
      additionalProperties: false
      required:
        - type
        - file_id
      properties:
        type:
          type: string
          enum:
            - FILE
        file_id:
          type: string
          minLength: 1
        title:
          type: string
        url:
          type: string
        datasource:
          type: string
    PlatformChatCustomEntitySource:
      type: object
      additionalProperties: false
      required:
        - type
        - entity_id
      properties:
        type:
          type: string
          enum:
            - CUSTOM_ENTITY
        entity_id:
          type: string
          minLength: 1
        name:
          type: string
        title:
          type: string
        url:
          type: string
        datasource:
          type: string
    PlatformChatCitationSource:
      description: Four-variant citation source union.
      oneOf:
        - $ref: "#/components/schemas/PlatformChatDocumentSource"
        - $ref: "#/components/schemas/PlatformChatPersonSource"
        - $ref: "#/components/schemas/PlatformChatFileSource"
        - $ref: "#/components/schemas/PlatformChatCustomEntitySource"
      discriminator:
        propertyName: type
        mapping:
          DOCUMENT: "#/components/schemas/ChatDocumentSource"
          PERSON: "#/components/schemas/ChatPersonSource"
          FILE: "#/components/schemas/ChatFileSource"
          CUSTOM_ENTITY: "#/components/schemas/ChatCustomEntitySource"
    PlatformChatCitationSnippet:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
        page_number:
          type: integer
          nullable: true
    PlatformChatCitationAnnotation:
      type: object
      additionalProperties: false
      required:
        - type
        - sources
      properties:
        type:
          type: string
          enum:
            - CITATION
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlatformChatCitationSource"
        start_index:
          type: integer
          minimum: 0
          nullable: true
        end_index:
          type: integer
          minimum: 0
          nullable: true
        snippets:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PlatformChatCitationSnippet"
    PlatformChatOutputTextContent:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - OUTPUT_TEXT
        text:
          type: string
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/PlatformChatCitationAnnotation"
    PlatformChatOutputMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - role
        - content
      properties:
        type:
          type: string
          enum:
            - MESSAGE
        role:
          type: string
          enum:
            - ASSISTANT
        content:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/PlatformChatOutputTextContent"
    PlatformChatCompletedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created_at
        - status
        - output
        - store
        - request_id
      properties:
        id:
          $ref: "#/components/schemas/PlatformChatStreamResponseId"
        object:
          type: string
          enum:
            - RESPONSE
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp when the response was created.
        status:
          type: string
          enum:
            - COMPLETED
        output:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/PlatformChatOutputMessage"
        store:
          type: boolean
        conversation_id:
          type: string
          minLength: 1
          nullable: true
          description: Present when the interaction was persisted.
        request_id:
          type: string
          minLength: 1
    PlatformSkillStatus:
      type: string
      enum:
        - DRAFT
        - ENABLED
        - DISABLED
      description: Current skill status.
    PlatformSkillOrigin:
      type: string
      enum:
        - CUSTOM
      description: Source category for the skill.
    PlatformSkillSyncStatus:
      type: string
      enum:
        - UP_TO_DATE
        - UPDATE_AVAILABLE
        - SYNC_FAILED
      description: Current external-source sync status.
    PlatformSkillSourceProvenance:
      type: object
      properties:
        source_url:
          type: string
          description: URL of the external source the skill was imported from.
        commit_sha:
          type: string
          description: Source commit SHA for the imported skill.
        imported_at:
          type: string
          format: date-time
          description: Time the skill was imported.
        last_synced_at:
          type: string
          format: date-time
          description: Time the skill was last synced from its source.
        sync_status:
          $ref: "#/components/schemas/PlatformSkillSyncStatus"
        sync_error:
          type: string
          description: Human-readable sync failure reason, present only when sync_status is SYNC_FAILED.
    PlatformPersonReference:
      type: object
      description: A lightweight reference to a person, used where a payload merely points at someone.
      required:
        - name
      properties:
        id:
          type: string
          description: Opaque Glean person ID.
        name:
          type: string
          description: Display name.
    PlatformSkill:
      type: object
      required:
        - id
        - display_name
        - description
        - latest_version
        - latest_minor_version
        - status
        - origin
        - owner
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Glean skill ID.
        display_name:
          type: string
          description: Human-readable skill name.
        description:
          type: string
          description: Human-readable skill description.
        latest_version:
          type: integer
          description: Latest major version number for the skill.
