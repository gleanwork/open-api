          type: string
          description: Datasource the event originated from.
          example: GITHUB
        reason:
          $ref: "#/components/schemas/PlatformTriggerEventReason"
        doc_type:
          type: string
          description: Datasource-specific object type.
          example: Ticket
        doc_id:
          type: string
          description: Identifier of the document the event is about.
        view_url:
          type: string
          description: Link to the document in its source system.
        title:
          type: string
          description: Title of the document, or the subject for email.
        event_time:
          type: string
          format: date-time
          description: "When the event happened at the source: the document's own change timestamp for a document change, and the scheduled time for a content schedule. Omitted when the source did not supply one."
    PlatformTriggerEventSearchResponse:
      type: object
      required:
        - results
        - has_more
        - request_id
      properties:
        results:
          type: array
          description: Matching events, most recent first.
          items:
            $ref: "#/components/schemas/PlatformTriggerEvent"
        has_more:
          type: boolean
          description: |
            Whether more events matched than were returned. Raise `page_size` to see more; cursor-based paging is not offered yet.
        request_id:
          type: string
