          example:
            TITLE: checkout outage
        page_size:
          type: integer
          description: Maximum number of events to return.
          minimum: 1
          maximum: 100
          default: 10
  responses:
    PlatformBadRequest:
      description: Invalid request (malformed JSON, invalid parameter values, unknown fields).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformUnauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformForbidden:
      description: Token valid but lacks permission for the requested operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformNotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformRequestTimeout:
      description: Backend did not respond within the timeout window.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformRequestTooLarge:
      description: Request body exceeds the maximum allowed size.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformTooManyRequests:
      description: Rate limit exceeded. Includes Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformInternalServerError:
      description: Unexpected server-side failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformServiceUnavailable:
      description: Backend temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformConflict:
      description: Request conflicts with current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
    PlatformUnprocessableEntity:
      description: Syntactically valid but semantically incorrect request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PlatformProblemDetail"
  parameters:
    TriggerWebhookId:
      name: webhook-id
      in: header
      required: true
      description: Opaque delivery ID. It remains stable across retries of the same event and can be used as an idempotency key.
      schema:
        type: string
        minLength: 1
      example: msg_test_123
    TriggerWebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when this delivery attempt was signed.
      schema:
        type: integer
        format: int64
      example: 1700000000
    TriggerWebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: |
        `v1,` followed by the standard Base64-encoded HMAC-SHA256 digest. To verify it, remove the
        `whsec_` prefix from `signing_secret`, standard-Base64-decode the remainder, and use those
        bytes as the HMAC key. Sign the UTF-8 bytes of `webhook-id + "." + webhook-timestamp + "."
        + raw request body`. Verify the signature against the unmodified request body before
        parsing JSON, and use a constant-time comparison.

        Fixed test vector (the raw body is one line with no trailing newline):

        - decoded signing key bytes (UTF-8; test only): `test_webhook_signing_secret_1234`
        - `webhook-id`: `81e6dc877ac553ef96ecbc939c1e46431159491991ba55cd131fbd0e3746c6bc`
        - `webhook-timestamp`: `1700000000`
        - `raw request body`: `{"version":"1","trigger_id":"trigger_test_123","datasource":"GITHUB","reason":"REVIEW_REQUESTED","doc_type":"pull","event_type":"DOCUMENT_CHANGE","doc_id":"GITHUB_pull_123","view_url":"https://github.com/acme/payments-api/pull/123","title":"Add retry backoff to the crawler","event_time":"2025-04-23T11:00:00Z"}`
        - `webhook-signature`: `v1,JqvHW0dwAOSLndiwQdXLUS/P+2RvOO8x4sOWgA/w0Gs=`
      schema:
        type: string
        pattern: ^v1,[A-Za-z0-9+/=]+$
      example: v1,xxx
