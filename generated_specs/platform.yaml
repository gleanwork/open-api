    PlatformTriggerEvent:
      type: object
      required:
        - event_type
        - doc_id
        - datasource
        - doc_type
        - view_url
        - title
        - reason
        - event_time
      description: A content event a trigger can fire on.
      properties:
        event_type:
          $ref: "#/components/schemas/PlatformTriggerEventType"
