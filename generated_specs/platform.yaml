    PlatformTriggerCreateRequest:
      type: object
      additionalProperties: false
      required:
        - preset_id
        - delivery
      properties:
        preset_id:
          type: string
          description: ID of the preset to instantiate.
          example: jira_high_priority_bug
        description:
          type: string
          description: Optional note describing this trigger.
          example: High-priority Jira bugs in the Engineering project
        inputs:
          type: object
          additionalProperties: true
