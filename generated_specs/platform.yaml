            $ref: "#/components/schemas/PlatformTriggerPresetInputValue"
        is_truncated:
          type: boolean
          description: |
            Whether additional selectable values were omitted from `values`. When true, use GET /trigger-presets/{preset_id}/input-values with a query to narrow the result set.
