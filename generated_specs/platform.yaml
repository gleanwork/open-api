    PlatformTriggerWithSecret:
      allOf:
        - $ref: "#/components/schemas/PlatformTrigger"
        - type: object
          required:
            - signing_secret
          properties:
            signing_secret:
              type: string
              pattern: ^whsec_[A-Za-z0-9+/=]+$
              example: whsec_xxx
              description: Secret for verifying webhook signatures, serialized as `whsec_<base64-encoded key>` following Standard Webhooks. Returned only when the trigger is created and cannot be retrieved later. Store it securely.
    PlatformTriggerCreateResponse:
      type: object
      required:
        - trigger
        - request_id
      properties:
        trigger:
          $ref: "#/components/schemas/PlatformTriggerWithSecret"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformTriggerWebhookEventBase:
      type: object
      required:
        - version
        - trigger_id
        - event_type
        - datasource
        - reason
        - doc_type
        - doc_id
        - view_url
        - title
      properties:
        version:
          type: string
          description: Webhook payload schema version.
          pattern: ^1$
        trigger_id:
          type: string
          description: ID of the Platform trigger that produced the event.
          example: trigger_test_123
        event_type:
          type: string
          description: Kind of trigger event.
        datasource:
          type: string
          description: Datasource the event originated from.
          example: GITHUB
        reason:
          type: string
          description: Why the event fired.
          example: REVIEW_REQUESTED
        doc_type:
          type: string
          description: Datasource-specific object type.
          example: pull
        doc_id:
          type: string
          description: Identifier of the document the event is about.
          example: GITHUB_pull_123
        view_url:
          type: string
          description: Link to the document in its source system.
          example: https://github.com/acme/payments-api/pull/123
        title:
          type: string
          description: Title of the document, or the subject for email.
          example: "Bug: login fails on Safari"
        event_time:
          type: string
          format: date-time
          description: Relevant event time. Document changes use the source-observed time when available and otherwise the document ingestion time; content schedules use the scheduled time. Omitted when no timestamp is available.
    PlatformDocumentChangeWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/PlatformTriggerWebhookEventBase"
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              pattern: ^DOCUMENT_CHANGE$
            content:
              type: string
              description: Email body content when the event is for an email document.
            content_truncated:
              type: boolean
              description: Present and true when source content exceeded the delivery size limit.
      example:
        version: "1"
        trigger_id: trigger_test_123
        event_type: DOCUMENT_CHANGE
        datasource: GITHUB
        reason: REVIEW_REQUESTED
        doc_type: pull
        doc_id: GITHUB_pull_123
        view_url: https://github.com/acme/payments-api/pull/123
        title: Add retry backoff to the crawler
        event_time: "2025-04-23T11:00:00Z"
    PlatformContentScheduleWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/PlatformTriggerWebhookEventBase"
        - type: object
          required:
            - event_type
            - time_offset_seconds
          properties:
            event_type:
              type: string
              pattern: ^CONTENT_SCHEDULE$
            time_offset_seconds:
              type: integer
              format: int32
