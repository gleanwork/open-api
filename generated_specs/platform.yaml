          $ref: "#/components/schemas/PlatformTriggerPreset"
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformTriggerPresetInputValueListResponse:
      type: object
      required:
        - results
        - is_truncated
        - request_id
      properties:
        results:
          type: array
          description: The bounded set of selectable values matching the query.
          items:
            $ref: "#/components/schemas/PlatformTriggerPresetInputValue"
        is_truncated:
          type: boolean
          description: |
            Whether additional matches were omitted. When true, refine `query` to narrow the result set.
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformTriggerPresetEventSearchRequest:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type: object
          description: |
            Values for the preset's input fields, keyed by field name.
