        - USER
    PlatformTriggerPresetInputValue:
      type: object
      required:
        - value
        - display_name
      properties:
        value:
          type: string
          description: |
            The exact value to send in the trigger's `inputs` for this choice (e.g. a channel name, a user's email, etc).
          example: person@example.com
        display_name:
          type: string
          description: Human-readable name for this value.
          example: Test User
    PlatformTriggerPresetInput:
      type: object
      required:
        - field
        - type
        - display_name
        - is_required
      properties:
        field:
          type: string
          description: Identifier of the input, supplied as a key in the trigger's `inputs`.
          example: project
        type:
          $ref: "#/components/schemas/PlatformTriggerPresetInputType"
        display_name:
          type: string
          description: Human-readable name for the input.
          example: Project
        is_required:
          type: boolean
          description: Whether the caller must supply a value for this input.
