openapi: 3.0.0
info:
  version: 0.9.0
  title: Release stages fixture
servers:
  - url: https://{instance}-be.glean.com
    variables:
      instance:
        default: instance-name
paths:
  /stage/beta:
    post:
      operationId: stage-beta
      x-glean-release:
        stage: beta
        docs: https://developers.glean.com/beta
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
  /stage/ga:
    post:
      operationId: stage-ga
      x-glean-release:
        stage: ga
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
  /stage/deprecated:
    post:
      operationId: stage-deprecated
      x-glean-release:
        stage: deprecated
        docs: https://developers.glean.com/migrate
        deprecation:
          message: Use POST /stage/ga instead
          introduced: '2026-10-01'
          removal: '2027-04-15'
      parameters:
        - name: oldParam
          in: query
          schema:
            type: string
          x-glean-release:
            stage: deprecated
            deprecation:
              message: Use newParam instead
              introduced: '2026-10-02'
              removal: '2027-04-16'
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
  /legacy/experimental:
    post:
      operationId: legacy-experimental
      x-glean-experimental:
        id: 4abc1e17-8e06-490b-99a7-e8f97592405a
        introduced: '2026-05-12'
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
  /legacy/deprecated:
    post:
      operationId: legacy-deprecated
      x-glean-deprecated:
        id: 0d9a8a3c-8c47-4c2f-9a39-3f0f6f4f3a10
        message: Use POST /stage/ga instead
        introduced: '2026-02-01'
        removal: '2026-10-15'
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
  /precedence:
    post:
      operationId: precedence
      # x-glean-release wins, so the old annotations below are ignored.
      x-glean-release:
        stage: ga
      x-glean-experimental:
        id: 9b7f0b8e-4b6d-4a63-9f43-1b8f5f3f2e11
      x-glean-deprecated:
        id: 1c2d3e4f-0000-4000-8000-000000000000
        message: Ignored
        introduced: '2026-01-01'
        removal: '2026-07-01'
      responses:
        '200':
          description: OK
      x-codeSamples:
        - lang: python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
            ) as glean:

                res = glean.call()
components:
  schemas:
    Fields:
      type: object
      properties:
        releaseDeprecated:
          type: string
          x-glean-release:
            stage: deprecated
            deprecation:
              message: Use newField instead
              introduced: '2026-10-03'
              removal: '2027-04-17'
        legacyDeprecated:
          type: string
          x-glean-deprecated:
            id: 2e3f4a5b-0000-4000-8000-000000000000
            message: Use newField instead
            introduced: '2026-02-03'
            removal: '2026-10-17'
        betaField:
          type: string
          x-glean-release:
            stage: beta
        releaseEnum:
          type: string
          enum:
            - STANDARD
            - LEGACY
            - OLD
          x-glean-release:
            - stage: deprecated
              enum-value: LEGACY
              deprecation:
                message: Use STANDARD instead
                introduced: '2026-10-04'
                removal: '2027-04-18'
            # enum-value can also sit inside deprecation.
            - stage: deprecated
              deprecation:
                enum-value: OLD
                message: Use STANDARD instead
                introduced: '2026-10-05'
                removal: '2027-04-19'
        legacyEnum:
          type: string
          enum:
            - STANDARD
            - LEGACY
          x-glean-deprecated:
            - id: 3f4a5b6c-0000-4000-8000-000000000000
              kind: enum-value
              enum-value: LEGACY
              message: Use STANDARD instead
              introduced: '2026-02-04'
              removal: '2026-10-18'
        overriddenEnum:
          type: string
          enum:
            - STANDARD
            - LEGACY
          # x-glean-release wins, so the old enum deprecation is ignored.
          x-glean-release:
            stage: ga
          x-glean-deprecated:
            - id: 4a5b6c7d-0000-4000-8000-000000000000
              kind: enum-value
              enum-value: LEGACY
              message: Ignored
              introduced: '2026-02-04'
              removal: '2026-10-18'
